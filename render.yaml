databases:
  - name: ecom-postgres-db
    databaseName: ecom_db
    user: ecom_user
    plan: free
    region: oregon

services:
  - type: redis
    name: ecom-redis-db
    plan: free
    maxmemoryPolicy: allkeys-lru
    region: oregon
    ipAllowList: []

  # ── Ecommerce Services ──────────────────────────────────────

  - type: web
    name: ecom-user-service
    env: docker
    rootDir: Ecommerce-proj/user-service
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: JWT_SECRET
        value: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7d5a58ba43e2c9d9c0b8fe8e9f
      - key: DB_URL
        value: jdbc:postgresql://${ecom-postgres-db.host}:${ecom-postgres-db.port}/${ecom-postgres-db.database}?user=${ecom-postgres-db.user}&password=${ecom-postgres-db.password}

  - type: web
    name: ecom-product-service
    env: docker
    rootDir: Ecommerce-proj/product-service
    plan: free
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
