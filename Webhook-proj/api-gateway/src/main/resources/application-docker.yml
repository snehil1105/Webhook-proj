spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service-auth
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: false

        - id: user-service-keys
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/keys/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        - id: webhook-service-endpoints
          uri: ${WEBHOOK_SERVICE_URL:http://webhook-service:8082}
          predicates:
            - Path=/api/endpoints/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        - id: webhook-service-events
          uri: ${WEBHOOK_SERVICE_URL:http://webhook-service:8082}
          predicates:
            - Path=/api/events/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true

        - id: dashboard-service
          uri: ${DASHBOARD_SERVICE_URL:http://dashboard-service:8084}
          predicates:
            - Path=/api/dashboard/**
          filters:
            - name: JwtAuthFilter
              args:
                requireAuth: true