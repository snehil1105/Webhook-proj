version: '3.8'

services:

  # ── Infrastructure ──────────────────────────────────────────

  postgres-users:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webhook-network

  postgres-webhooks:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: webhooks_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-webhooks-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webhook-network

  postgres-delivery:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-delivery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webhook-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - webhook-network

  # ── Application Services ────────────────────────────────────

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres-users:
        condition: service_healthy
    restart: on-failure
    networks:
      - webhook-network

  webhook-service:
    build:
      context: ./webhook-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres-webhooks:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - webhook-network

  delivery-service:
    build:
      context: ./delivery-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres-delivery:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - webhook-network

  dashboard-service:
    build:
      context: ./dashboard-service
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres-delivery:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure
    networks:
      - webhook-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8085:8080"
    depends_on:
      user-service:
        condition: service_started
      webhook-service:
        condition: service_started
    restart: on-failure
    networks:
      - webhook-network

# ── Networks ────────────────────────────────────────────────

networks:
  webhook-network:
    driver: bridge

# ── Volumes ─────────────────────────────────────────────────

volumes:
  postgres-users-data:
  postgres-webhooks-data:
  postgres-delivery-data:
  redis-data: