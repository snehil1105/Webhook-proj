server:
  port: 8083

spring:
  application:
    name: delivery-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/delivery_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata
          format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  redis:
    stream-name: webhook.events
    retry-stream-name: webhook.events.retry
    dlq-stream-name: webhook.events.dlq
    consumer-group: delivery-workers
    consumer-name: worker-1        # unique per instance
  delivery:
    max-attempts: 5
    timeout-ms: 5000               # 5 second HTTP timeout
    retry-scheduler-interval-ms: 10000  # check retries every 10 seconds