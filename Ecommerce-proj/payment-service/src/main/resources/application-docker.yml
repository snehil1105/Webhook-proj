spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:ecom-postgres-payments}:${DB_PORT:5432}/${DB_NAME:payments_db}}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false

order-service:
  base-url: ${ORDER_SERVICE_URL:http://ecom-order-service:9093}
product-service:
  base-url: ${PRODUCT_SERVICE_URL:http://ecom-product-service:9092}
user-service:
  base-url: ${USER_SERVICE_URL:http://ecom-user-service:9091}