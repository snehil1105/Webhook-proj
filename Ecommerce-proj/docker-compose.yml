services:
  # Infrastructure Services
  ecom-postgres-users:
    image: postgres:15-alpine
    container_name: ecom-postgres-users
    restart: on-failure
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5441:5432"
    volumes:
      - ecom-postgres-users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-network

  ecom-postgres-products:
    image: postgres:15-alpine
    container_name: ecom-postgres-products
    restart: on-failure
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5442:5432"
    volumes:
      - ecom-postgres-products-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-network

  ecom-postgres-orders:
    image: postgres:15-alpine
    container_name: ecom-postgres-orders
    restart: on-failure
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5443:5432"
    volumes:
      - ecom-postgres-orders-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-network

  ecom-postgres-payments:
    image: postgres:15-alpine
    container_name: ecom-postgres-payments
    restart: on-failure
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5444:5432"
    volumes:
      - ecom-postgres-payments-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-network

  ecom-redis:
    image: redis:7-alpine
    container_name: ecom-redis
    restart: on-failure
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - ecom-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-network

  ecom-zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: ecom-zookeeper
    restart: on-failure
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-network

  ecom-kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: ecom-kafka
    restart: on-failure
    depends_on:
      ecom-zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ecom-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://ecom-kafka:9092,PLAINTEXT_HOST://localhost:9097
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9097:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || true"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ecom-network

  # Application Services
  ecom-user-service:
    build:
      context: ./user-service
    container_name: ecom-user-service
    restart: on-failure
    depends_on:
      ecom-postgres-users:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_YOUR_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-YOUR_KEY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9091:9091"
    networks:
      - ecom-network

  ecom-product-service:
    build:
      context: ./product-service
    container_name: ecom-product-service
    restart: on-failure
    depends_on:
      ecom-postgres-products:
        condition: service_healthy
      ecom-redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "9092:9092"
    networks:
      - ecom-network

  ecom-order-service:
    build:
      context: ./order-service
    container_name: ecom-order-service
    restart: on-failure
    depends_on:
      ecom-postgres-orders:
        condition: service_healthy
      ecom-kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ecom-kafka:9092
    ports:
      - "9093:9093"
    networks:
      - ecom-network

  ecom-payment-service:
    build:
      context: ./payment-service
    container_name: ecom-payment-service
    restart: on-failure
    depends_on:
      ecom-postgres-payments:
        condition: service_healthy
      ecom-kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_YOUR_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-YOUR_KEY_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ecom-kafka:9092
    ports:
      - "9094:9094"
    networks:
      - ecom-network

  ecom-inventory-service:
    build:
      context: ./inventory-service
    container_name: ecom-inventory-service
    restart: on-failure
    depends_on:
      ecom-kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: ecom-kafka:9092
    ports:
      - "9095:9095"
    networks:
      - ecom-network

  ecom-webhook-bridge:
    build:
      context: ./webhook-bridge-service
    container_name: ecom-webhook-bridge
    restart: on-failure
    depends_on:
      ecom-kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      WEBHOOK_PLATFORM_JWT_TOKEN: ${WEBHOOK_PLATFORM_JWT_TOKEN}
      APP_WEBHOOK_PLATFORM_JWT_TOKEN: ${WEBHOOK_PLATFORM_JWT_TOKEN}
      KAFKA_BROKER: ecom-kafka:9092
    ports:
      - "9096:9096"
    networks:
      - ecom-network
      - webhook-proj_webhook-network

  ecom-api-gateway:
    build:
      context: ./api-gateway
    container_name: ecom-api-gateway
    restart: on-failure
    depends_on:
      - ecom-user-service
      - ecom-product-service
      - ecom-order-service
      - ecom-payment-service
      - ecom-inventory-service
      - ecom-webhook-bridge
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "9090:9090"
    networks:
      - ecom-network

volumes:
  ecom-postgres-users-data:
  ecom-postgres-products-data:
  ecom-postgres-orders-data:
  ecom-postgres-payments-data:
  ecom-redis-data:

networks:
  ecom-network:
    driver: bridge
  webhook-proj_webhook-network:
    external: true